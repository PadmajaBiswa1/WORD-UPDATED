<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EtherX Word</title>
    <meta name="description" content="Collaborative word processor with rich text editing, document templates, AI writing assistant, and export tools." />
    <meta property="og:title" content="EtherX Word" />
    <meta property="og:description" content="Collaborative word processor with rich text editing, document templates, AI writing assistant, and export tools." />
    <link rel="icon" type="image/png" href="/assets/etherx-favicon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c9a84c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body, #root {
        background-color: #0a0a0a;
        color: #F5F1E8;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      (function() {
        if (typeof window !== 'undefined' && (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('.local'))) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(r) { r.unregister(); });
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                if (k.indexOf('etherx') !== -1) caches.delete(k);
              });
            }).catch(function() {});
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
